[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtf-smc-xauusd"
version = "0.1.0"
description = "Falsification-oriented backtest of a multi-timeframe SMC price-action strategy on XAUUSD."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [{ name = "Aaron" }]
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["mtf_smc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
